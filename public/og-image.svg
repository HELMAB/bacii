<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630" font-family="Niradei, 'Noto Serif Khmer', serif">
  <!--
    Source for og-image.png: run `npm run generate-png-assets` after editing.
    Styled after 1970s Khmer record sleeves. The title is outlined from Limon F4, so it
    needs no font. Other Khmer text is set in Niradei (falls back to Noto Serif Khmer).
  -->
  <defs>
    <!-- Printed dot screens -->
    <pattern id="screenBlue" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3.5" cy="3.5" r="1.9" fill="#0f4f8c"/>
    </pattern>
    <pattern id="screenInk" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2.5" cy="2.5" r="1.25" fill="#14110d"/>
    </pattern>

    <!-- Ornament band: an original scroll, repeated -->
    <pattern id="kbach" width="56" height="44" patternUnits="userSpaceOnUse">
      <rect width="56" height="44" fill="#e8c34a"/>
      <path d="M2 34 C4 14 20 6 30 12 C39 18 34 31 25 29 C18 27 20 18 27 19
               M30 12 C38 4 48 6 54 12 M30 12 C34 20 42 30 54 34
               M2 34 C8 40 16 40 22 37 M54 12 C50 18 50 24 54 28"
            fill="none" stroke="#c7231f" stroke-width="5.2" stroke-linecap="round"/>
      <circle cx="8" cy="10" r="4.4" fill="#c7231f"/>
      <circle cx="44" cy="34" r="3.2" fill="#c7231f"/>
    </pattern>

    <!-- Worn ink edges -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
    <radialGradient id="age" cx="50%" cy="50%" r="75%">
      <stop offset="62%" stop-color="#5b3a10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5b3a10" stop-opacity="0.30"/>
    </radialGradient>
    <path id="title" d="M68.5 -108.3V-94.9H75V-8.9L71.3 -7Q64.3 -7 63.3 -12.2V-96.4L62.7 -101Q62.7 -102.5 60.6 -105Q58.4 -107.4 52.6 -108.3H13.8V-94.9H20.2V-19.6Q22.9 -10.4 32.3 -5.2Q41.6 0 52.6 0H75H117.8V-95.5L116.9 -100.4Q116.9 -102.5 114.4 -105Q111.1 -108.3 106.2 -108.3Z M151.2 -91.5Q148.7 -93.3 146.3 -94.2L138.9 -94.9H128.2V-108.3H177.2Q186 -108.3 189.6 -106.9Q193.1 -105.6 194.6 -103.7L198.3 -100.4L200.1 -95.5V0H156.7V-78.9L154.8 -85.4Q154.2 -87.8 151.2 -91.5Z M263.2 -66.4V0H220V-71.9L220.6 -73.4Q221.5 -78 224.1 -80Q226.7 -82 230.4 -82H279.4V-84.8Q279.4 -87.5 277.1 -90.3Q274.8 -93 271.4 -94.2L265.6 -94.9H220V-108.3H297.1L306.6 -107.4Q312.7 -105.9 314.3 -104.8Q315.8 -103.7 316.7 -103.3Q317.6 -102.8 318.5 -101L321.9 -93V-13.5H327.1V0H289.2L286.7 -1.5L282.1 -4.6Q280 -7 278.5 -13.5V-70.7Q271.4 -70.7 269.3 -70.1Q266.5 -70.1 263.2 -66.4Z M321.6 -120.6V-150.2H278.8V-120.6Z M424.1 -108.3Q438.2 -108.3 441.6 -105.9Q444 -104.3 446.5 -93.9V-49.3H385.3V-19.3Q385.3 -16.8 388 -15L395.4 -13.8Q400.9 -13.8 405.1 -18.1V-42.2H446.5V0.3H405.1V-8.9Q403.3 -6.1 395 -1.8Q389.5 0.3 382.8 0.3L371.5 -0.6L359.2 -4.9Q352.8 -7.6 347.9 -15.6L342.7 -29.1V-61.2H402.7V-82.6L402.4 -89.4Q401.5 -94.9 394.1 -94.9L387.7 -92.4Q386.5 -91.5 384.9 -89V-77.7H391.7V-65.2H355.9L352.8 -66.1Q349.8 -67 347.3 -69.8Q342.7 -74.1 342.7 -78.9V-94.9Q342.7 -100.4 346.1 -103.7Q348.5 -105.9 352.8 -107.4L358.3 -108.3H370.9Q374.2 -108.3 378.4 -106.3Q382.5 -104.3 384.6 -99.5Q388.6 -104 392.1 -106.2Q395.7 -108.3 401.8 -108.3Z M394.7 28.8Q395.7 25.4 397.8 23.3L399.9 22L402.4 25.4V68.2H445.8V23.3Q445.8 16.8 435.4 11Q430.2 8 425.3 6.4Q420.4 4.9 414.6 4.9Q397.8 4.9 390.8 11.3Q385.6 18.1 383.4 24.2Q383.4 31.5 390.8 31.5Q392.9 31.5 394.7 28.8Z M515.6 -108.3V-94.9H522V-8.9L518.4 -7Q511.3 -7 510.4 -12.2V-96.4L509.8 -101Q509.8 -102.5 507.7 -105Q505.5 -107.4 499.7 -108.3H460.8V-94.9H467.3V-19.6Q470 -10.4 479.3 -5.2Q488.7 0 499.7 0H522H564.9V-95.5L564 -100.4Q564 -102.5 561.5 -105Q558.1 -108.3 553.2 -108.3Z"/>
    <path id="stampArc" d="M 949 462 a 72 72 0 1 1 144 0"/>
    <clipPath id="oval"><ellipse cx="262" cy="315" rx="155" ry="181"/></clipPath>
  </defs>

  <!-- Paper -->
  <rect width="1200" height="630" fill="#e8c34a"/>

  <!-- Ornament border -->
  <path fill-rule="evenodd" fill="url(#kbach)" d="M14 14H1186V616H14Z M60 60V570H1140V60Z"/>
  <path fill="none" stroke="#c7231f" stroke-width="4" d="M14 14H1186V616H14Z M58 58H1142V572H58Z"/>

  <!-- Teal frame and blue panel, with the plates slightly out of register -->
  <rect x="68" y="68" width="1064" height="494" fill="#0f7a66"/>
  <rect x="93" y="91" width="1018" height="448" fill="#1f76bd"/>
  <rect x="93" y="91" width="1018" height="448" fill="url(#screenBlue)" opacity="0.6"/>

  <!-- Rings, standing in for the sleeve's portrait frame and for the record itself -->
  <g filter="url(#rough)">
    <ellipse cx="266" cy="319" rx="214" ry="240" fill="#14110d" stroke="none" stroke-width="0"/>
    <ellipse cx="262" cy="315" rx="210" ry="236" fill="#c7231f" stroke="none" stroke-width="0"/>
    <ellipse cx="262" cy="315" rx="196" ry="222" fill="#e8c34a" stroke="none" stroke-width="0"/>
    <ellipse cx="262" cy="315" rx="190" ry="216" fill="#c7231f" stroke="none" stroke-width="0"/>
    <ellipse cx="262" cy="315" rx="176" ry="202" fill="#14110d" stroke="none" stroke-width="0"/>
    <ellipse cx="262" cy="315" rx="173" ry="199" fill="#c7231f" stroke="none" stroke-width="0"/>
    <ellipse cx="262" cy="315" rx="160" ry="186" fill="#e8c34a" stroke="none" stroke-width="0"/>
    <ellipse cx="262" cy="315" rx="155" ry="181" fill="#f3e6bd" stroke="none" stroke-width="0"/>
  </g>

  <!-- Exam paper, printed in black on cream -->
  <g clip-path="url(#oval)">
    <rect x="80" y="100" width="380" height="430" fill="url(#screenInk)" opacity="0.32"/>
    <g transform="rotate(-8 262 315)">
      <rect x="150" y="146" width="238" height="344" fill="#14110d" opacity="0.8" transform="translate(9 9)"/>
      <rect x="150" y="146" width="238" height="344" fill="#fbf3d9" stroke="#14110d" stroke-width="2.5"/>
      <text x="269" y="196" text-anchor="middle" font-size="30" font-weight="900" fill="#14110d">វិញ្ញាសា</text>
      <text x="269" y="232" text-anchor="middle" font-size="19" font-weight="700" fill="#14110d">រយៈពេល ១៥០ នាទី</text>
      <path d="M176 250H362" stroke="#14110d" stroke-width="3"/>
      <g stroke="#14110d" stroke-width="4">
        <path d="M176 278H362M176 302H346M176 326H362M176 350H330M176 374H362M176 398H352M176 422H300M176 446H340"/>
      </g>
      <circle cx="344" cy="432" r="31" fill="none" stroke="#c7231f" stroke-width="6"/>
      <text x="344" y="444" text-anchor="middle" font-size="33" font-weight="900" fill="#c7231f">ល្អ</text>
    </g>
  </g>

  <!-- Credit line -->
  <text x="790" y="126" text-anchor="middle" font-size="27" font-weight="700" fill="#fff4cf">ឯកសារប្រឡង ឆ្នាំ ២០១៤ ដល់ ២០២២</text>

  <!-- Title: painted red with a white keyline and a black drop, as on the sleeves -->
  <g transform="translate(500 292)">
    <use xlink:href="#title" href="#title" transform="translate(9 9)" fill="#14110d" stroke="#14110d" stroke-width="9" stroke-linejoin="round"/>
    <use xlink:href="#title" href="#title" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
    <use xlink:href="#title" href="#title" transform="translate(-2 2)" fill="#c7231f"/>
  </g>

  <!-- Cream cut-out -->
  <path transform="translate(7 7)" fill="#14110d" d="M470 408 C540 388 650 416 760 404 C860 394 1000 384 1096 400 L1096 520 C980 532 860 512 740 524 C640 534 540 512 470 522 Z"/>
  <path fill="#f6e9c2" stroke="#14110d" stroke-width="3" d="M470 408 C540 388 650 416 760 404 C860 394 1000 384 1096 400 L1096 520 C980 532 860 512 740 524 C640 534 540 512 470 522 Z"/>
  <text x="498" y="458" font-size="38" font-weight="900" fill="#14110d">ឯកសារប្រឡង ១៣៨</text>
  <text x="498" y="498" font-size="27" font-weight="700" fill="#c7231f">អានឥតគិតថ្លៃ និងក្រៅបណ្តាញ</text>

  <!-- Label stamp, where a sleeve carries its record label -->
  <g>
    <circle cx="1021" cy="462" r="86" fill="#14110d" transform="translate(6 6)"/>
    <circle cx="1021" cy="462" r="86" fill="#14110d" stroke="#e8c34a" stroke-width="5"/>
    <circle cx="1021" cy="462" r="60" fill="#c7231f" stroke="#f6e9c2" stroke-width="3"/>
    <text font-size="15.5" font-family="'Peng Huoth', PengHuoth, serif" fill="#f6e9c2" letter-spacing="0.6"><textPath xlink:href="#stampArc" href="#stampArc" startOffset="50%" text-anchor="middle">dobpi.netlify.app</textPath></text>
    <text x="1021" y="475" text-anchor="middle" font-family="'Peng Huoth', PengHuoth, serif" font-size="37" font-weight="700" fill="#ffffff">Dobpi</text>
  </g>

  <!-- Aged paper edges -->
  <rect width="1200" height="630" fill="url(#age)"/>
</svg>
