<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="530" r="100" fill="white" opacity="0.1"/>
  <circle cx="950" cy="100" r="60" fill="white" opacity="0.08"/>

  <!-- Main content container -->
  <rect x="100" y="150" width="1000" height="330" rx="20" fill="white" opacity="0.95"/>

  <!-- Logo/Icon -->
  <g transform="translate(150, 200)">
    <rect width="80" height="100" rx="8" fill="#3B82F6"/>
    <rect width="80" height="20" y="20" rx="4" fill="white" opacity="0.3"/>
    <line x1="20" y1="50" x2="60" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="60" y2="60" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="50" y2="70" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#1F2937">Dobpi</text>

  <!-- Description -->
  <text x="280" y="330" font-family="Arial, sans-serif" font-size="32" fill="#4B5563">ឯកសារប្រឡងបាក់ឌុប</text>

  <!-- Year range -->
  <text x="280" y="380" font-family="Arial, sans-serif" font-size="28" fill="#6B7280">២០១៤ - ២០២២</text>

  <!-- Features -->
  <g transform="translate(280, 410)">
    <circle cx="8" cy="-5" r="4" fill="#10B981"/>
    <text x="20" y="0" font-family="Arial, sans-serif" font-size="20" fill="#6B7280">មើលឯកសារ PDF ដោយឥតគិតថ្លៃ</text>
  </g>

  <g transform="translate(600, 410)">
    <circle cx="8" cy="-5" r="4" fill="#10B981"/>
    <text x="20" y="0" font-family="Arial, sans-serif" font-size="20" fill="#6B7280">ទាញយកងាយស្រួល</text>
  </g>
</svg>
